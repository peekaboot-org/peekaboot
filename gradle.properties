# The Spring Boot line, read once by the plugin in buildSrc and by the BOM the convention
# plugin imports into every module (Maven: spring-boot.version in the root pom and the
# testing-app's parent version).
springBootVersion=4.1.1
# The starter's query instrumentation and the autoconfigure module's compile-only view of it
# (Maven: datasource-micrometer.version in the root pom).
datasourceMicrometerVersion=2.3.0
# Gradle needs more heap than its default for Error Prone + SpotBugs in-process work.
org.gradle.jvmargs=-Xmx1g
# Worker threads for concurrent *IT classes in peekaboot-testing-app; mirrors the
# Maven property of the same name (see peekaboot-testing-app/pom.xml for why 2).
peekaboot.it.threads=2
# Playwright engine those *IT classes drive: chromium, firefox or webkit. Mirrors the
# Maven property of the same name.
peekaboot.it.browser=chromium
