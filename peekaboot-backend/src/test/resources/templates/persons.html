<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Persons</title>
</head>
<body>
    <h1>Persons List</h1>
    <table>
        <thead>
            <tr><th>ID</th><th>Name</th><th>Email</th></tr>
        </thead>
        <tbody>
            <tr th:each="person : ${persons}">
                <td th:text="${person.id}"></td>
                <td th:text="${person.firstName + ' ' + person.lastName}"></td>
                <td th:text="${person.email}"></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
