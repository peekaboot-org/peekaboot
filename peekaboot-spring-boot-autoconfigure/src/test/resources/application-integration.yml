spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
  # No migrations in this module. Left on, Flyway validates an empty location and WARNs.
  flyway:
    enabled: false
  docker:
    compose:
      enabled: false
  web:
    error:
      # never is the Boot default; pinned here so ErrorDispatchIT proves the page shows the
      # trace regardless of what the application's global setting says, without a properties
      # override that would fork it off DevToolbarAutoConfigurationIT's cached context.
      include-stacktrace: never

peekaboot:
  enabled: true
  dev-toolbar: true
  error-page:
    enabled: true
