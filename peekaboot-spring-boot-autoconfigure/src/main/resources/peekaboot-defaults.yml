# peekaboot-defaults.yml
# These defaults enable full observability for peekaboot.
# Apps can override any of these in their own application.yml

spring:
  jpa:
    properties:
      # Hibernate statistics for query performance insights
      # Spring default: false | We enable to expose query counts, cache stats, slow queries
      "[hibernate.generate_statistics]": true

management:
  endpoint:
    health:
      # Controls visibility of health check details (db, disk, etc.)
      # Spring default: never | We show always to expose component health in dashboard
      show-details: always
    env:
      # Whether property VALUES are readable at all. Left at Spring's default the
      # Environment tab renders "******" for every entry - os.name and server.port
      # included - which makes the tab useless.
      # Spring default: never | We show values so Peekaboot's own masking engine (see
      # org.peekaboot.backend.masking) has real values to decide over.
      #
      # Deliberately kept "always" rather than removed: Spring Boot 4.1 registers no
      # default SanitizingFunction, so leaving this at Spring's own default ("never")
      # would not hand masking to Spring - it would return "******" for every property
      # unconditionally, starving Peekaboot's engine of the real values it needs to
      # apply its own, more precise rules. The Environment/Config tabs would degrade to
      # the useless-tab outcome described above, and controlled unmasking
      # (peekaboot.enable-unmasking, see PeekabootController) would have nothing to
      # unmask. Peekaboot's own masking is what keeps the default posture safe, not
      # this setting - see MaskingEngine and the two-opt-in design in the known-defects
      # spec.
      #
      # Accepted cost: this also widens the consuming application's own
      # /actuator/env and /actuator/configprops if it exposes those endpoints itself,
      # independently of Peekaboot. An application wanting the strict posture can set
      # management.endpoint.env.show-values (and .configprops.show-values): never
      # itself, which overrides this lowest-precedence default.
      show-values: always
    configprops:
      # Same reasoning as endpoint.env above, for the Config tab.
      show-values: always

  info:
    env:
      # Publishes info.* properties (e.g. info.app.* from application.yml) in
      # /actuator/info - not OS/system environment variables, which is what the
      # Environment tab (management.endpoint.env) already covers.
      # Spring default: false | We enable for environment visibility in dashboard
      enabled: true
    java:
      # Exposes JVM vendor, version, runtime info
      # Spring default: false | We enable for Java runtime details in dashboard
      enabled: true
    os:
      # Exposes OS name, version, architecture
      # Spring default: false | We enable for system info in dashboard
      enabled: true
    process:
      # Exposes PID, uptime, CPU count, memory usage
      # Spring default: false | We enable for process metrics in dashboard
      enabled: true
    git:
      # Exposes git commit, branch info from git.properties
      # Spring default: true | We keep enabled for build traceability
      enabled: true

  tracing:
    sampling:
      # Percentage of requests to trace (0.0 to 1.0)
      # Spring default: 0.1 (10%) | We sample all requests for complete trace visibility
      probability: 1.0

  observations:
    annotations:
      # Enables @Observed, @Timed, @Counted annotations
      # Spring default: false | We enable for declarative observability
      enabled: true

  # No OTLP push defaults here: those live in peekaboot-no-push-defaults.yml,
  # which is applied unconditionally (even when peekaboot is disabled)

# Third-party library defaults (only apply if dependency present)

decorator:
  datasource:
    datasource-proxy:
      # Pretty-print SQL for readability in logs
      # Library default: false | We enable for debugging SQL queries
      format-sql: true
      query:
        # Log level for SQL query logging
        # Library default: DEBUG | We use TRACE for detailed query capture
        log-level: TRACE

logbook:
  predicate:
    include:
      # Paths to log HTTP requests/responses for
      # Library default: all paths | We limit to /api/** to reduce noise
      - path: /api/**
  format:
    # Output format for logged requests
    # Library default: json | We use http for human-readable format
    style: http
  # When to log response bodies
  # Library default: without-body | We log body only on errors for debugging
  strategy: body-only-if-status-at-least
  minimum-status: 400
