# These defaults enable full observability for peekaboot.
# Apps can override any of these in their own application.yml

spring:
  jpa:
    properties:
      # Needed by the hibernate.* meter panels in peekaboot-insights-defaults.yml, whose
      # meters HibernateStatisticsMeterBinder binds from these statistics (or Boot's binder,
      # with hibernate-micrometer present) - and only while statistics are on.
      # Spring default: false
      "[hibernate.generate_statistics]": true

management:
  # No management.endpoint.* defaults here, deliberately. Peekaboot reads health, env,
  # configprops and the rest through endpoint instances it constructs itself (see
  # ActuatorSourcesAutoConfiguration), so none of the application's endpoint settings -
  # show-details, show-values, exposure, access - decides what the dashboard sees, and
  # Peekaboot has no reason to change any of them. MaskingEngine is what masks a value.

  tracing:
    sampling:
      # Percentage of requests to trace (0.0 to 1.0)
      # Spring default: 0.1 (10%) | We sample all requests for complete trace visibility
      probability: 1.0

  metrics:
    observations:
      # Registers <observation>.active long task timers; the "HTTP in flight" panel reads them
      # Spring default: false since Boot 4.2 (4.1 registers them always and ignores this key)
      include-active-long-task-timer: true

  observations:
    annotations:
      # Enables @Observed, @Timed, @Counted annotations
      # Spring default: false | We enable for declarative observability
      enabled: true

  # No OTLP push defaults here: those live in peekaboot-no-push-defaults.yml,
  # which is applied unconditionally (even when peekaboot is disabled)
