version: 2
updates:
  # "/" covers .github/workflows and a root action.yml only, not the composite actions.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    # Merged updates run in the dev build, which holds the publishing token. A week gives a
    # compromised release time to surface first; security updates are not delayed.
    cooldown:
      default-days: 7
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    # One pull request for the whole Boot line: its version is declared twice on the Maven
    # side (the parent property and the testing-app's parent), and a bump that lands in one
    # place only leaves the reactor building two Boot versions. The auto-merge workflow
    # excludes this group - see its comment for why Boot is reviewed by a person.
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot:*"
    ignore:
      # Its WebKit 27.2 reports a CSP violation for every <select>: https://bugs.webkit.org/show_bug.cgi?id=327212
      - dependency-name: "com.microsoft.playwright:playwright"
        versions: ["1.64.0"]
  # The parallel Gradle build must stay in lockstep with Maven (BUILD.md); it reads
  # buildSrc and every build.gradle.kts.
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
  # The frontend lint gate's toolchain. package.json lives in the module, not at the repo
  # root, so the directory has to be named - the same reason the composite action's pins
  # need theirs above. No auto-merge exclusion: CI builds these, so a bump that breaks a
  # rule goes red before the merge job would touch it.
  - package-ecosystem: "npm"
    directory: "/peekaboot-frontend"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
