version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
  # The parallel Gradle build must stay in lockstep with Maven (BUILD.md); it reads
  # buildSrc, every build.gradle.kts and gradle.properties.
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "daily"
