version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # "/" covers .github/workflows and a root action.yml only; the composite action's own
  # pins need their directory listed.
  - package-ecosystem: "github-actions"
    directory: "/.github/actions/prepare-build"
    schedule:
      interval: "weekly"
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
    # One pull request for the whole Boot line: its version is declared twice on the Maven
    # side (the parent property and the testing-app's parent), and a bump that lands in one
    # place only leaves the reactor building two Boot versions. The auto-merge workflow
    # excludes this group - see its comment for why Boot is reviewed by a person.
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot:*"
  # The parallel Gradle build must stay in lockstep with Maven (BUILD.md); it reads
  # buildSrc, every build.gradle.kts and gradle.properties.
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "daily"
  # The frontend lint gate's toolchain. package.json lives in the module, not at the repo
  # root, so the directory has to be named - the same reason the composite action's pins
  # need theirs above. No auto-merge exclusion: unlike the gradle ecosystem, CI does build
  # these, so a bump that breaks a rule goes red before the merge job would touch it.
  - package-ecosystem: "npm"
    directory: "/peekaboot-frontend"
    schedule:
      interval: "daily"
