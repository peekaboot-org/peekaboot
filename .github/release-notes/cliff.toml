# Release notes for peekaboot, grouped by conventional-commit type.
# https://git-cliff.org/docs/configuration

[changelog]
body = """
{% if version %}\
## {{ version }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}
{# A tagged release with no predecessor has nothing to diff against, so its notes would
   otherwise be every commit since the repository began. An UNRELEASED section with no
   predecessor is different: that is the work going into the first release, and listing it
   is the point. #}\
{% if version and not previous.version %}\
Initial release.

{% else %}\
{% set breaking = commits | filter(attribute="breaking", value=true) | unique(attribute="message") %}\
{% if breaking | length > 0 %}\
### Breaking changes
{% for commit in breaking %}\
{# A `!` marker with no BREAKING CHANGE footer leaves breaking_description == message. #}\
{% set detail = commit.breaking_description | default(value="") | split(pat="\n") | first %}\
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
{{ commit.message | upper_first }}\
{% if detail and detail != commit.message %}. {{ detail }}{% endif %}
{% endfor %}
{% endif %}\
{% for group, group_commits in commits | group_by(attribute="group") %}\
### {{ group | striptags | trim }}
{% for commit in group_commits | unique(attribute="message") %}\
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
{% if commit.breaking %}[**breaking**] {% endif %}\
{{ commit.message | upper_first }}
{% endfor %}
{% endfor %}\
{% if previous.version %}\
**Full changelog**: <REPO>/compare/{{ previous.version }}...{% if version %}{{ version }}{% else %}dev{% endif %}

{% endif %}\
{% endif %}\
"""
trim = true
postprocessors = [
    { pattern = '<REPO>', replace = "https://github.com/peekaboot-org/peekaboot" },
]

[git]
conventional_commits = true
# Drops merge commits and maven-release-plugin's `[release] ...` commits: neither parses.
filter_unconventional = true
protect_breaking_commits = true
# Only semver tags are release boundaries, so a stray `unreleased` tag cannot become one.
tag_pattern = '^[0-9]+\.[0-9]+\.[0-9]+$'
# The first matching parser wins. Test-harness scopes stay above `^feat`, `^build\(deps-dev\)`
# above `^build\(deps`, and `^build\(deps` above the generic `^build`. The numbers stay
# zero-padded two digits because git-cliff sorts group names as strings. site.jq shows groups
# 01-03 on the website, so renumbering those means editing it too.
commit_parsers = [
    # Shipped commits typed fix: that fix no bug a user could hit. History is not rewritten.
    # ca362a2e and 76fc2537 changed tests only.
    { sha = "ca362a2ec9ef976392c84fe7dc6fc986509289c3", group = "<!-- 08 -->Tests" },
    { sha = "76fc25377de62e302c41447826f85580ccae0d8d", group = "<!-- 08 -->Tests" },
    # f5449589 is the wording follow-up of 6d1ba5aa, which carries the entry.
    { sha = "f5449589da9d6b7187d462028897cf0139850236", skip = true },
    { message = '^(feat|fix|perf)\((testing-app|test)\)', group = "<!-- 08 -->Tests" },
    { message = '^feat', group = "<!-- 01 -->Features" },
    { message = '^fix', group = "<!-- 02 -->Bug fixes" },
    { message = '^perf', group = "<!-- 03 -->Performance" },
    { message = '^build\(deps-dev\)', group = "<!-- 09 -->Build, CI and chores" },
    { message = '^build\(deps', group = "<!-- 04 -->Dependency upgrades" },
    { message = '^revert', group = "<!-- 05 -->Reverts" },
    { message = '^docs', group = "<!-- 06 -->Documentation" },
    { message = '^refactor', group = "<!-- 07 -->Internal changes" },
    { message = '^test', group = "<!-- 08 -->Tests" },
    { message = '^build|^ci|^chore|^style', group = "<!-- 09 -->Build, CI and chores" },
]
# No `.*` catch-all: an unknown type is dropped here and caught by the push gate instead.
filter_commits = true
sort_commits = "oldest"
