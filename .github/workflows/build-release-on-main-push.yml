name: build-release-on-main-push

on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-release-on-main-push:
    if: ${{ !contains(github.event.head_commit.message, '[release]') }} # prevent recursive releases
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # full history: the spotless ratchet resolves a fixed base commit
          fetch-depth: 0

      - name: setup-jdk
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: 25
          distribution: 'temurin'
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.OSSRH_GPG_SECRET_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: playwright-${{ runner.os }}-

      # Explicit install so a cold cache doesn't depend on Playwright.create()'s implicit
      # download happening to work mid-test-run.
      #
      # Two steps, not one: `exec:java` ad-hoc goal invocations ignore -pl scoping when
      # combined with -am (verified locally: it runs the goal against every upstream
      # reactor module too, and fails on the first one that doesn't have playwright on
      # its classpath). So the reactor's own SNAPSHOT jars must already be resolvable from
      # the local repo before the plain (no -am) exec:java call below can resolve
      # peekaboot-testing-app's own dependency graph.
      - name: install-reactor-snapshots
        run: mvn --batch-mode -pl peekaboot-testing-app -am install -Dmaven.test.skip=true

      # classpathScope=test is required because the playwright dependency is test-scoped;
      # without it exec:java can't find com.microsoft.playwright.CLI.
      - name: install-playwright-browser
        run: >
          mvn --batch-mode -pl peekaboot-testing-app exec:java
          -Dexec.mainClass=com.microsoft.playwright.CLI
          -Dexec.classpathScope=test
          -Dexec.args="install chromium"

      - name: maven-build-verify
        run: mvn --batch-mode verify

      - name: configure-git-user
        uses: qoomon/actions--setup-git@8e6bd30ac05e17a81b61169daae62cb6b7e61294 # v1.1.1
        with:
          user: bot

      - name: prepare-release
        run: mvn --batch-mode -P peekaboot-release release:prepare
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}

      - name: perform-release-publish-on-maven-central
        # no third test run: the tag's tree passed `verify` in this job and again in release:prepare's preparationGoals
        run: mvn --batch-mode -P peekaboot-release release:perform -Darguments="-DskipTests -Djacoco.skip=true"
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}

      - name: 'get-latest-tag'
        id: 'get-latest-tag'
        uses: WyriHaximus/github-action-get-previous-tag@61819f33034117e6c686e6a31dba995a85afc9de # v2.0.0

      - name: create-release-notes
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          tag_name: ${{ steps.get-latest-tag.outputs.tag }}

      # A direct push would be refused: the ruleset on dev requires the build-on-push
      # status check, and a merge commit pushed here has none. A pull request with
      # auto-merge is the path that ruleset accepts. An open one from an earlier release
      # is reused; new commits on main land on it automatically.
      - name: merge-main-to-dev
        run: |
          pr_url="$(gh pr list --base dev --head main --state open --json url --jq '.[0].url')"
          if [ -z "$pr_url" ]; then
            pr_url="$(gh pr create --base dev --head main \
              --title "[release] merge released main back to dev" \
              --body "Carries the version commits of release ${{ steps.get-latest-tag.outputs.tag }} back to dev.")"
          fi
          gh pr merge --auto --merge "$pr_url"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}