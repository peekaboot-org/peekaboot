name: build-release-on-main-push

on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-release-on-main-push:
    if: ${{ !contains(github.event.head_commit.message, '[release]') }} # prevent recursive releases
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # full history: the spotless ratchet resolves a fixed base commit
          fetch-depth: 0

      # A local action resolves from the runner's workspace, so the checkout has to come first.
      - name: prepare-build
        uses: ./.github/actions/prepare-build
        with:
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.OSSRH_GPG_SECRET_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: maven-build-verify
        run: ./mvnw --batch-mode verify

      # Before release:prepare and release:perform: a failed download or checksum here must
      # not strand a job that has already published to Central.
      - name: install-git-cliff
        uses: ./.github/actions/install-git-cliff

      # git-cliff picks the version here and groups the same subjects into the notes below,
      # so one tool's reading of the history settles both.
      - name: resolve-release-version
        id: resolve-release-version
        run: |
          version="$(.github/release-notes/render.sh --bumped-version)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::git-cliff returned '$version', not an x.y.z version"
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/$version" > /dev/null; then
            echo "::error::tag $version already exists"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Rendered before the tag exists, so --tag has to name the version being released, and
      # staged so that release:prepare's own commit carries it. Regenerated whole rather than
      # prepended: deterministic, and no header_marker to manage. A broken render fails the
      # job here, before anything is signed or published.
      - name: render-changelog
        run: |
          .github/release-notes/render.sh --tag "${{ steps.resolve-release-version.outputs.version }}" \
            --output CHANGELOG.md
          grep -q "^## ${{ steps.resolve-release-version.outputs.version }} " CHANGELOG.md
          git add CHANGELOG.md

      - name: configure-git-user
        uses: qoomon/actions--setup-git@8e6bd30ac05e17a81b61169daae62cb6b7e61294 # v1.1.1
        with:
          user: bot

      # No developmentVersion: the release plugin derives the next `-SNAPSHOT` from the
      # release version by incrementing its patch.
      - name: prepare-release
        run: |
          ./mvnw --batch-mode -P peekaboot-release release:prepare \
            -DreleaseVersion=${{ steps.resolve-release-version.outputs.version }}
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}

      # The changelog rides into the release commit on maven-scm's `git commit` taking the
      # whole index, which it documents nowhere. A regression has to surface here, where the
      # damage is a tag, and not after Central holds the artifacts.
      - name: verify-release-commit
        run: |
          git grep -q "^## ${{ steps.resolve-release-version.outputs.version }} " \
            "${{ steps.resolve-release-version.outputs.version }}" -- CHANGELOG.md

      - name: perform-release-publish-on-maven-central
        # no third test run: release:prepare's preparationGoals verified the tag's tree, and this
        # job's own build verified the same sources before the changelog was added to them
        run: ./mvnw --batch-mode -P peekaboot-release release:perform -Darguments="-DskipTests -Djacoco.skip=true"
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}

      - name: render-release-notes
        run: |
          .github/release-notes/render.sh --latest \
            --output release-notes.md
          # A tag_pattern that stops matching makes git-cliff render all history as
          # "## Unreleased" and still exit 0, which would publish as the release body.
          grep -q "^## ${{ steps.resolve-release-version.outputs.version }} " release-notes.md

      - name: create-release-notes
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: release-notes.md
          tag_name: ${{ steps.resolve-release-version.outputs.version }}

      # After the real release exists, so a failure between the two leaves the draft
      # standing rather than losing the notes. A skipped delete only strands a cosmetic
      # draft, which the new cycle's first push to dev overwrites. No --cleanup-tag: a
      # draft has no tag.
      - name: delete-unreleased-draft
        run: |
          if gh release view unreleased > /dev/null 2>&1; then
            gh release delete unreleased --yes
          else
            echo "no unreleased draft to clean up"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The only block here that pipes, hence the only one setting pipefail: the default
      # shell is `bash -e` without it, so a failed render would still exit 0 and leave jq
      # writing a zero-byte file, which the next step publishes as an empty release list.
      # The length check guards the same silent success the two render steps above grep for.
      - name: render-site-release-data
        run: |
          set -o pipefail
          .github/release-notes/render.sh --context \
            | jq -f .github/release-notes/site.jq > releases.json
          jq -e 'length > 0' releases.json > /dev/null

      # The site runs GitHub's legacy Pages build: no workflow, no plugins, nothing
      # fetched at build time, so the data has to be committed into that repo.
      # The clone inherits the job's git identity from configure-git-user.
      - name: push-site-release-data
        run: |
          git clone --depth 1 \
            "https://x-access-token:${SITE_REPO_TOKEN}@github.com/peekaboot-org/peekaboot-org.github.io.git" \
            site
          cp releases.json site/_data/releases.json
          git -C site add _data/releases.json
          git -C site diff --cached --quiet || git -C site commit \
            -m "[release] release data for ${{ steps.resolve-release-version.outputs.version }}"
          git -C site push origin HEAD:main
        env:
          SITE_REPO_TOKEN: ${{ secrets.SITE_REPO_TOKEN }}

      # With GitHub Actions on the dev ruleset's bypass list this pushes straight through.
      # The pull request stays as the fallback for when it cannot - the ruleset requires a
      # build-on-push check, and a commit pushed here by GITHUB_TOKEN never gets one because
      # that token starts no workflows. Central has already been published by this point, so
      # a refused push must leave the release recoverable rather than fail the job.
      - name: merge-main-to-dev
        run: |
          git fetch origin dev:refs/remotes/origin/dev
          git checkout -B release-merge origin/dev
          git merge main -m "[release] merge released main back to dev"
          if git push origin HEAD:dev; then
            exit 0
          fi
          echo "::warning::direct push to dev refused, opening a pull request instead"
          pr_url="$(gh pr list --base dev --head main --state open --json url --jq '.[0].url')"
          if [ -z "$pr_url" ]; then
            pr_url="$(gh pr create --base dev --head main \
              --title "[release] merge released main back to dev" \
              --body "Carries the version commits of release ${{ steps.resolve-release-version.outputs.version }} back to dev.")"
          fi
          gh pr merge --auto --merge "$pr_url"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}