name: build-release-on-main-push

on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-release-on-main-push:
    if: ${{ !contains(github.event.head_commit.message, '[release]') }} # prevent recursive releases
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: write
      packages: write

    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          ref: main
          # full history: the spotless ratchet resolves a fixed base commit
          fetch-depth: 0

      - name: setup-jdk
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: 'temurin'
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.OSSRH_GPG_SECRET_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: playwright-${{ runner.os }}-

      # Explicit install so a cold cache doesn't depend on Playwright.create()'s implicit
      # download happening to work mid-test-run.
      #
      # Two steps, not one: `exec:java` ad-hoc goal invocations ignore -pl scoping when
      # combined with -am (verified locally: it runs the goal against every upstream
      # reactor module too, and fails on the first one that doesn't have playwright on
      # its classpath). So the reactor's own SNAPSHOT jars must already be resolvable from
      # the local repo before the plain (no -am) exec:java call below can resolve
      # peekaboot-testing-app's own dependency graph.
      - name: install-reactor-snapshots
        run: mvn --batch-mode -pl peekaboot-testing-app -am install -Dmaven.test.skip=true

      # classpathScope=test is required because the playwright dependency is test-scoped;
      # without it exec:java can't find com.microsoft.playwright.CLI.
      - name: install-playwright-browser
        run: >
          mvn --batch-mode -pl peekaboot-testing-app exec:java
          -Dexec.mainClass=com.microsoft.playwright.CLI
          -Dexec.classpathScope=test
          -Dexec.args="install chromium"

      - name: maven-build-verify
        run: mvn --batch-mode verify

      - name: configure-git-user
        uses: qoomon/actions--setup-git@v1
        with:
          user: bot

      # For reproducible builds is it required to separate release:prepare (with -DskipStaging=true) and release:perform, otherwise
      # the artifact will be already uploaded during release:prepare

      - name: prepare-release
        run: mvn --batch-mode -P peekaboot-release release:prepare -DskipStaging=true
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}

      - name: perform-release-publish-on-maven-central
        run: mvn --batch-mode -P peekaboot-release release:perform
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}

      - name: 'get-latest-tag'
        id: 'get-latest-tag'
        uses: "WyriHaximus/github-action-get-previous-tag@v2"

      - name: create-release-notes
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          tag_name: ${{ steps.get-latest-tag.outputs.tag }}

      - name: merge-main-to-dev
        run: |
          git checkout dev
          git pull
          git merge --no-ff main -m "[release] auto-merge released main back to dev"
          git push