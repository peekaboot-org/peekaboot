name: build-release-on-main-push

on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-release-on-main-push:
    if: ${{ !contains(github.event.head_commit.message, '[release]') }} # prevent recursive releases
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # full history: the spotless ratchet resolves a fixed base commit
          fetch-depth: 0

      # A local action resolves from the runner's workspace, so the checkout has to come first.
      - name: prepare-build
        uses: ./.github/actions/prepare-build
        with:
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.OSSRH_GPG_SECRET_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: maven-build-verify
        run: ./mvnw --batch-mode verify

      # Before release:prepare and release:perform: a failed download or checksum here must
      # not strand a job that has already published to Central.
      - name: install-git-cliff
        uses: ./.github/actions/install-git-cliff

      - name: check-release-notes-renderable
        run: .github/release-notes/render.sh --unreleased > /dev/null

      - name: configure-git-user
        uses: qoomon/actions--setup-git@8e6bd30ac05e17a81b61169daae62cb6b7e61294 # v1.1.1
        with:
          user: bot

      - name: prepare-release
        run: ./mvnw --batch-mode -P peekaboot-release release:prepare
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}

      - name: perform-release-publish-on-maven-central
        # no third test run: the tag's tree passed `verify` in this job and again in release:prepare's preparationGoals
        run: ./mvnw --batch-mode -P peekaboot-release release:perform -Darguments="-DskipTests -Djacoco.skip=true"
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}

      - name: 'get-latest-tag'
        id: 'get-latest-tag'
        uses: WyriHaximus/github-action-get-previous-tag@83f26fea93bc7efcbca2eb5591f5eaaf66b8f206 # v2.1.0

      - name: render-release-notes
        run: |
          .github/release-notes/render.sh --latest \
            --output release-notes.md
          # A tag_pattern that stops matching makes git-cliff render all history as
          # "## Unreleased" and still exit 0, which would publish as the release body.
          grep -q "^## ${{ steps.get-latest-tag.outputs.tag }} " release-notes.md

      # Regenerated whole rather than prepended: deterministic, and no header_marker to
      # manage. No --tag needed, the tag release:prepare created is already in the repo.
      - name: render-changelog
        run: |
          .github/release-notes/render.sh --output CHANGELOG.md
          grep -q "^## ${{ steps.get-latest-tag.outputs.tag }} " CHANGELOG.md

      - name: commit-changelog
        run: |
          git add CHANGELOG.md
          git diff --cached --quiet || git commit \
            -m "[release] update the changelog for ${{ steps.get-latest-tag.outputs.tag }}"
          git push origin HEAD:main

      - name: create-release-notes
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: release-notes.md
          tag_name: ${{ steps.get-latest-tag.outputs.tag }}

      # After the real release exists, so a failure between the two leaves the draft
      # standing rather than losing the notes. A skipped delete only strands a cosmetic
      # draft, which the new cycle's first push to dev overwrites. No --cleanup-tag: a
      # draft has no tag.
      - name: delete-unreleased-draft
        run: |
          if gh release view unreleased > /dev/null 2>&1; then
            gh release delete unreleased --yes
          else
            echo "no unreleased draft to clean up"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The only block here that pipes, hence the only one setting pipefail: the default
      # shell is `bash -e` without it, so a failed render would still exit 0 and leave jq
      # writing a zero-byte file, which the next step publishes as an empty release list.
      # The length check guards the same silent success the two render steps above grep for.
      - name: render-site-release-data
        run: |
          set -o pipefail
          .github/release-notes/render.sh --context \
            | jq -f .github/release-notes/site.jq > releases.json
          jq -e 'length > 0' releases.json > /dev/null

      # The site runs GitHub's legacy Pages build: no workflow, no plugins, nothing
      # fetched at build time, so the data has to be committed into that repo.
      # The clone inherits the job's git identity from configure-git-user.
      - name: push-site-release-data
        run: |
          git clone --depth 1 \
            "https://x-access-token:${SITE_REPO_TOKEN}@github.com/peekaboot-org/peekaboot-org.github.io.git" \
            site
          cp releases.json site/_data/releases.json
          git -C site add _data/releases.json
          git -C site diff --cached --quiet || git -C site commit \
            -m "[release] release data for ${{ steps.get-latest-tag.outputs.tag }}"
          git -C site push origin HEAD:main
        env:
          SITE_REPO_TOKEN: ${{ secrets.SITE_REPO_TOKEN }}

      # A direct push would be refused: the ruleset on dev requires the build-on-push
      # status check, and a merge commit pushed here has none. A pull request with
      # auto-merge is the path that ruleset accepts. An open one from an earlier release
      # is reused; new commits on main land on it automatically.
      - name: merge-main-to-dev
        run: |
          pr_url="$(gh pr list --base dev --head main --state open --json url --jq '.[0].url')"
          if [ -z "$pr_url" ]; then
            pr_url="$(gh pr create --base dev --head main \
              --title "[release] merge released main back to dev" \
              --body "Carries the version commits of release ${{ steps.get-latest-tag.outputs.tag }} back to dev.")"
          fi
          gh pr merge --auto --merge "$pr_url"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}