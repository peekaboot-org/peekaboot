name: release

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: 'Override the version git-cliff derives (x.y.z). Empty uses git-cliff.'
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: write

    steps:
      # workflow_dispatch carries no branch filter, so a run started from a feature branch
      # would otherwise tag and release that branch. A failing step rather than a job-level
      # `if`, which would report a mis-dispatch as a green skip.
      - name: guard-release-ref
        run: |
          if [ "$GITHUB_REF" != "refs/heads/dev" ]; then
            echo "::error::releases run on dev only; this run was dispatched from $GITHUB_REF"
            exit 1
          fi

      # No `ref`: checkout leaves HEAD on a local `dev`, and maven-scm pushes to whatever
      # branch it finds checked out, which is the whole mechanism targeting `dev`. Naming
      # `ref: dev` would redirect a mis-dispatched run instead of letting the guard fail it.
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # full history: git-cliff resolves the range back to the previous tag
          fetch-depth: 0

      # A local action resolves from the runner's workspace, so the checkout has to come first.
      - name: prepare-build
        uses: ./.github/actions/prepare-build
        with:
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.OSSRH_GPG_SECRET_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: maven-build-verify
        run: ./mvnw --batch-mode verify

      # Before release:prepare and release:perform: a failed download or checksum here must
      # not strand a job that has already published to Central.
      - name: install-git-cliff
        uses: ./.github/actions/install-git-cliff

      # git-cliff picks the version here and groups the same subjects into the notes below,
      # so one tool's reading of the history settles both. The dispatch input overrides it for
      # the case where it reads the bump wrong, and takes the same checks either way. Through
      # `env`, never `${{ }}` inside the script: an input interpolated there is a shell
      # injection for anyone with write access.
      - name: resolve-release-version
        id: resolve-release-version
        env:
          OVERRIDE: ${{ inputs.releaseVersion }}
        run: |
          version="$OVERRIDE"
          source="the releaseVersion input"
          if [ -z "$version" ]; then
            version="$(.github/release-notes/render.sh --bumped-version)"
            source="git-cliff"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$source returned '$version', not an x.y.z version"
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/$version" > /dev/null; then
            echo "::error::tag $version already exists"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Rendered before the tag exists, so --tag has to name the version being released, and
      # staged so that release:prepare's own commit carries it. Regenerated whole rather than
      # prepended: deterministic, and no header_marker to manage. A broken render fails the
      # job here, before anything is signed or published.
      - name: render-changelog
        run: |
          .github/release-notes/render.sh --tag "${{ steps.resolve-release-version.outputs.version }}" \
            --output CHANGELOG.md
          grep -q "^## ${{ steps.resolve-release-version.outputs.version }} " CHANGELOG.md
          git add CHANGELOG.md

      # Staged beside the changelog so release:prepare's own commit carries it, which puts the
      # released version in the tagged tree rather than in a commit after it. README.md holds
      # the only dependency snippet this repo spells a version out in. sed then grep: a pattern
      # that stops matching still exits 0, and the stale version would publish unnoticed.
      - name: stage-readme-version
        env:
          VERSION: ${{ steps.resolve-release-version.outputs.version }}
        run: |
          sed -i -E "s|^( *<version>)[0-9]+\.[0-9]+\.[0-9]+(</version>)$|\1${VERSION}\2|" README.md
          grep -q "<version>${VERSION}</version>" README.md
          git add README.md

      - name: configure-git-user
        uses: qoomon/actions--setup-git@8e6bd30ac05e17a81b61169daae62cb6b7e61294 # v1.1.1
        with:
          user: bot

      # No developmentVersion: the release plugin derives the next `-SNAPSHOT` from the
      # release version by incrementing its patch.
      - name: prepare-release
        run: |
          ./mvnw --batch-mode -P peekaboot-release release:prepare \
            -DreleaseVersion=${{ steps.resolve-release-version.outputs.version }}
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}

      # The changelog and the README rewrite ride into the release commit on maven-scm's
      # `git commit` taking the whole index, which it documents nowhere. A regression has to
      # surface here, where the damage is a tag, and not after Central holds the artifacts.
      - name: verify-release-commit
        run: |
          git grep -q "^## ${{ steps.resolve-release-version.outputs.version }} " \
            "${{ steps.resolve-release-version.outputs.version }}" -- CHANGELOG.md
          git grep -q "<version>${{ steps.resolve-release-version.outputs.version }}</version>" \
            "${{ steps.resolve-release-version.outputs.version }}" -- README.md

      - name: perform-release-publish-on-maven-central
        # no third test run: release:prepare's preparationGoals verified the tag's tree, and this
        # job's own build verified the same sources before the changelog was added to them
        run: ./mvnw --batch-mode -P peekaboot-release release:perform -Darguments="-DskipTests -Djacoco.skip=true"
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}

      # main originates nothing; it is a pointer that only ever fast-forwards onto the commit
      # that was published. Pushing a bare commit SHA makes git refuse anything but a
      # fast-forward, so this needs no --force and can never rewrite main. The tag is
      # annotated, hence the dereference: pushing a tag object to a branch ref is rejected.
      # First of the post-publish steps because it is the one that cannot fail on its own, so
      # a later step failing cannot leave main stale.
      - name: fast-forward-main
        env:
          VERSION: ${{ steps.resolve-release-version.outputs.version }}
        run: |
          tag_commit="$(git rev-parse "refs/tags/${VERSION}^{commit}")"
          git push origin "${tag_commit}:refs/heads/main"

      - name: render-release-notes
        run: |
          .github/release-notes/render.sh --latest \
            --output release-notes.md
          # A tag_pattern that stops matching makes git-cliff render all history as
          # "## Unreleased" and still exit 0, which would publish as the release body.
          grep -q "^## ${{ steps.resolve-release-version.outputs.version }} " release-notes.md

      - name: create-release-notes
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: release-notes.md
          tag_name: ${{ steps.resolve-release-version.outputs.version }}

      # After the real release exists, so a failure between the two leaves the draft
      # standing rather than losing the notes. A skipped delete only strands a cosmetic
      # draft, which the new cycle's first push to dev overwrites. No --cleanup-tag: a
      # draft has no tag.
      - name: delete-unreleased-draft
        run: |
          if gh release view unreleased > /dev/null 2>&1; then
            gh release delete unreleased --yes
          else
            echo "no unreleased draft to clean up"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The only block here that pipes, hence the only one setting pipefail: the default
      # shell is `bash -e` without it, so a failed render would still exit 0 and leave jq
      # writing a zero-byte file, which the next step publishes as an empty release list.
      # The length check guards the same silent success the two render steps above grep for.
      - name: render-site-release-data
        run: |
          set -o pipefail
          .github/release-notes/render.sh --context \
            | jq -f .github/release-notes/site.jq > releases.json
          jq -e 'length > 0' releases.json > /dev/null

      # The site runs GitHub's legacy Pages build: no workflow, no plugins, nothing fetched at
      # build time, so both the release data and the version have to be committed into that
      # repo. It follows this repo's model - commits land on `dev` and `main` is fast-forwarded
      # onto them, and that second push is what makes Pages rebuild. A full clone rather than
      # --depth 1, because a shallow clone cannot be relied on to push a branch it did not
      # fetch. The clone inherits the job's git identity from configure-git-user.
      - name: publish-site
        env:
          SITE_REPO_TOKEN: ${{ secrets.SITE_REPO_TOKEN }}
          VERSION: ${{ steps.resolve-release-version.outputs.version }}
        run: |
          git clone --branch dev \
            "https://x-access-token:${SITE_REPO_TOKEN}@github.com/peekaboot-org/peekaboot-org.github.io.git" \
            site
          cp releases.json site/_data/releases.json
          sed -i -E "s|^peekaboot_version: .*$|peekaboot_version: ${VERSION}|" site/_config.yml
          grep -q "^peekaboot_version: ${VERSION}$" site/_config.yml
          git -C site add _data/releases.json _config.yml
          git -C site diff --cached --quiet || git -C site commit \
            -m "[release] site for ${VERSION}"
          # Annotated, matching the app repo's tags. An existing tag fails the step rather than
          # silently retagging, the same way resolve-release-version refuses a taken version.
          git -C site tag -a "${VERSION}" -m "[release] site for ${VERSION}"
          git -C site push origin HEAD:dev
          git -C site push origin HEAD:main
          git -C site push origin "refs/tags/${VERSION}"