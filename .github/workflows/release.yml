name: release

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: 'Override the version git-cliff derives (x.y.z). Empty uses git-cliff.'
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write

    steps:
      # workflow_dispatch carries no branch filter, so a run started from a feature branch
      # would otherwise tag and release that branch. A failing step rather than a job-level
      # `if`, which would report a mis-dispatch as a green skip.
      - name: guard-release-ref
        run: |
          if [ "$GITHUB_REF" != "refs/heads/dev" ]; then
            echo "::error::releases run on dev only; this run was dispatched from $GITHUB_REF"
            exit 1
          fi

      # No `ref`: checkout leaves HEAD on a local `dev`. release:prepare commits to it and
      # `publish-refs.sh branches` pushes it, which is the whole mechanism targeting `dev`.
      # Naming `ref: dev` would redirect a mis-dispatched run instead of letting the guard
      # fail it.
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # full history: git-cliff resolves the range back to the previous tag
          fetch-depth: 0
          # The build and its tests run with no write token on disk; the two push steps
          # bring their own.
          persist-credentials: false

      # The tag is public before the upload and stays public when a later step fails, so
      # each of these stops a doomed run before that. First, so nothing is built or rendered
      # for one.
      - name: preflight
        run: |
          # A second dispatch queued behind this one by the concurrency group checks out the
          # SHA dev was at when it was dispatched, so it cannot see the release that just ran.
          remote_dev="$(git ls-remote origin refs/heads/dev | cut -f1)"
          if [ "$remote_dev" != "$(git rev-parse HEAD)" ]; then
            echo "::error::dev moved since this run was dispatched; dispatch again"
            exit 1
          fi

          # The tag of a failed upload stays public until a person deletes it, and git-cliff
          # must not resolve a version beside it.
          unfinished="$(git tag --no-merged HEAD --list '[0-9]*.[0-9]*.[0-9]*')"
          if [ -n "$unfinished" ]; then
            for tag in $unfinished; do
              echo "::error::tag ${tag} is not on dev: a release did not finish. See BUILD.md, Recovering a release"
            done
            exit 1
          fi

          # A release leaves exactly one commit after its tag, the next development version.
          last_tag="$(git describe --tags --abbrev=0 --match '[0-9]*.[0-9]*.[0-9]*' 2> /dev/null || true)"
          if [ -n "$last_tag" ] && [ "$(git rev-list --no-merges --count "${last_tag}..HEAD")" -le 1 ]; then
            echo "::error::nothing to release: no commit since ${last_tag} but the next development version"
            exit 1
          fi

          # publish-release-branches pushes main without --force, so a main that is not
          # behind dev would reject it after the publish.
          if ! git merge-base --is-ancestor refs/remotes/origin/main HEAD; then
            echo "::error::main is not an ancestor of dev, so it cannot fast-forward to the release"
            exit 1
          fi

      # No cache: what is signed and published is built from nothing an earlier run left
      # behind. No server and no key either: release:prepare has nothing to authenticate with.
      - name: prepare-build
        uses: ./.github/actions/prepare-build
        with:
          cache: 'false'

      # Before release:prepare and release:perform: a failed download or checksum here must
      # not strand a job that has already published to Central.
      - name: install-git-cliff
        uses: ./.github/actions/install-git-cliff

      # git-cliff picks the version from the commit subjects. The dispatch input overrides it for
      # the case where it reads the bump wrong, and takes the same checks either way. Through
      # `env`, never `${{ }}` inside the script: an input interpolated there is a shell
      # injection for anyone with write access.
      - name: resolve-release-version
        env:
          OVERRIDE: ${{ inputs.releaseVersion }}
        run: |
          version="$OVERRIDE"
          source="the releaseVersion input"
          if [ -z "$version" ]; then
            version="$(.github/release-notes/render.sh --bumped-version)"
            source="git-cliff"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$source returned '$version', not an x.y.z version"
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/$version" > /dev/null; then
            echo "::error::tag $version already exists"
            exit 1
          fi
          # Every later script reads it from env, which never interpolates into shell text.
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # The notes are written by hand under a `## x.y.z` heading before the release. Without
      # them the job stops here, before anything is built, signed or published. The date goes
      # into the heading now and is staged, so release:prepare's own commit carries it.
      - name: stamp-changelog
        run: |
          .github/release-notes/stamp.sh "${VERSION}" "$(date -u +%F)"
          git add CHANGELOG.md

      # Staged beside the changelog so release:prepare's own commit carries it, which puts the
      # released version in the tagged tree rather than in a commit after it. README.md holds
      # the only dependency snippet this repo spells a version out in. sed then grep: a pattern
      # that stops matching still exits 0, and the stale version would publish unnoticed.
      - name: stage-readme-version
        run: |
          sed -i -E "s|^( *<version>)[0-9]+\.[0-9]+\.[0-9]+(</version>)$|\1${VERSION}\2|" README.md
          grep -q "<version>${VERSION}</version>" README.md
          git add README.md

      # The identity checkout documents for commits made with the built-in token. Global, so
      # publish-site's commit in the site repository carries the same identity.
      - name: configure-git-user
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'

      # No developmentVersion: the release plugin derives the next `-SNAPSHOT` from the
      # release version by incrementing its patch. No profile and no secret: this is the step
      # that runs the tests, and it signs nothing. It commits and tags on the runner and
      # pushes neither (pushChanges in pom.xml).
      - name: prepare-release
        run: |
          ./mvnw --batch-mode release:prepare \
            -DreleaseVersion="${VERSION}"

      # The changelog and the README rewrite ride into the release commit on maven-scm's
      # `git commit` taking the whole index, which it documents nowhere. A regression
      # surfaces here, before the tag is pushed.
      - name: verify-release-commit
        run: |
          git grep -q "^## ${VERSION} " "${VERSION}" -- CHANGELOG.md
          git grep -q "<version>${VERSION}</version>" "${VERSION}" -- README.md

      # setup-java a second time, so the key and the Central server entry exist from here on
      # only. Above the tag push, so a failed import leaves nothing public. The pin is
      # prepare-build's; dependabot.yml watches both directories, so the two move together.
      - name: import-signing-key
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: 25
          distribution: 'temurin'
          server-id: central
          server-username-env-var: MAVEN_USERNAME
          server-password-env-var: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.OSSRH_GPG_SECRET_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE
          mvn-server-repository-origins: central:https://central.sonatype.com

      # The checkout kept no credential, so the write token enters here. The tag goes first
      # because release:perform builds what `origin` serves under it.
      - name: push-release-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh auth setup-git
          .github/release/publish-refs.sh tag "${VERSION}"

      # No second test run: release:prepare's preparationGoals verified the tag's tree, and
      # nothing is pushed or published before that verify passes, so it is the job's one gate.
      # The fork clones the tag from `origin` and builds that, with both profiles from
      # releaseProfiles in pom.xml.
      - name: perform-release-publish-on-maven-central
        run: ./mvnw --batch-mode release:perform -Darguments="-DskipTests -DskipITs -Djacoco.skip=true"
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}

      # release:perform returns at the upload (waitUntil=uploaded in pom.xml), so this is what
      # holds the post-publish steps back until the release can be downloaded.
      - name: await-maven-central
        run: .github/central/await-release.sh "${VERSION}"

      # `main` and `dev` move only once Central has the release. First of the post-publish
      # steps, so a later step failing cannot leave either branch stale.
      - name: publish-release-branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh auth setup-git
          .github/release/publish-refs.sh branches "${VERSION}"

      # The release body is the written section. The tag before this one closes the compare
      # link; `^` steps off the release commit, which carries the new tag itself.
      - name: extract-release-notes
        run: |
          .github/release-notes/section.sh "${VERSION}" > release-notes.md
          previous="$(git describe --tags --abbrev=0 --match '[0-9]*.[0-9]*.[0-9]*' "${VERSION}^")"
          printf '\n**Full changelog**: https://github.com/peekaboot-org/peekaboot/compare/%s...%s\n' \
            "$previous" "${VERSION}" >> release-notes.md

      # --verify-tag: fails rather than creating the tag if push-release-tag's push is missing.
      - name: create-release-notes
        run: |
          gh release create "${VERSION}" --verify-tag --title "${VERSION}" \
            --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # After the real release exists, so a failure between the two leaves the draft
      # standing rather than losing the notes. A skipped delete only strands a cosmetic
      # draft, which the new cycle's first push to dev overwrites. No --cleanup-tag: a
      # draft has no tag.
      - name: delete-unreleased-draft
        run: |
          if gh release view unreleased > /dev/null 2>&1; then
            gh release delete unreleased --yes
          else
            echo "no unreleased draft to clean up"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A heading the stamp did not reach leaves the new release out of the data, and the
      # site would publish without it.
      - name: render-site-release-data
        run: |
          jq -Rs -f .github/release-notes/site.jq CHANGELOG.md > releases.json
          jq -e --arg version "${VERSION}" '.[0].version == $version' releases.json > /dev/null

      # The token goes to checkout as an input and reaches git as an auth header, so it is
      # never part of a URL. The clone keeps it for publish-site's pushes.
      - name: checkout-site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: peekaboot-org/peekaboot-org.github.io
          ref: dev
          token: ${{ secrets.SITE_REPO_TOKEN }}
          path: site
          fetch-depth: 0

      # The site runs GitHub's legacy Pages build: no workflow, no plugins, nothing fetched at
      # build time, so both the release data and the version have to be committed into that
      # repo. It follows this repo's model - commits land on `dev` and `main` is fast-forwarded
      # onto them, and that second push is what makes Pages rebuild. checkout-site clones in
      # full rather than at depth 1, because a shallow clone cannot be relied on to push a
      # branch it did not fetch. The commit takes the job's git identity from
      # configure-git-user.
      - name: publish-site
        run: |
          cp releases.json site/_data/releases.json
          sed -i -E "s|^peekaboot_version: .*$|peekaboot_version: ${VERSION}|" site/_config.yml
          grep -q "^peekaboot_version: ${VERSION}$" site/_config.yml
          git -C site add _data/releases.json _config.yml
          git -C site diff --cached --quiet || git -C site commit \
            -m "[release] site for ${VERSION}"
          # Annotated, matching the app repo's tags. An existing tag fails the step rather than
          # silently retagging, the same way resolve-release-version refuses a taken version.
          git -C site tag -a "${VERSION}" -m "[release] site for ${VERSION}"
          git -C site push origin HEAD:dev
          git -C site push origin HEAD:main
          git -C site push origin "refs/tags/${VERSION}"

      # Last, and only on a failure: where the run stopped decides what a person does next.
      - name: report-unfinished-release
        if: failure()
        run: |
          {
            echo "### The release did not finish"
            echo
            if [ -n "${VERSION:-}" ]; then
              echo "What \`origin\` has of ${VERSION}, and where its branches are:"
              echo
              echo '```'
              git ls-remote origin "refs/tags/${VERSION}" refs/heads/dev refs/heads/main \
                || echo "origin could not be read"
              echo '```'
              echo
            fi
            echo "BUILD.md, \"Recovering a release\", says what to do."
          } >> "$GITHUB_STEP_SUMMARY"

  # The release pushed dev with GITHUB_TOKEN, which starts no push run, so the next snapshot
  # is built on request. A job of its own, so the release job never holds `actions: write`.
  build-next-snapshot:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      actions: write

    steps:
      - name: dispatch-build-on-push
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run build-on-push.yml --ref dev
