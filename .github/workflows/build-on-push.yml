name: build-on-push

on:
  push:
    branches-ignore:
      - main
  # dependabot-pr-auto-merge dispatches this on dev after a merge, whose GITHUB_TOKEN push
  # starts no run of its own.
  workflow_dispatch:

concurrency:
  group: build-on-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-on-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Publishing authenticates to Central with the release's secrets, not with GITHUB_TOKEN.
    permissions:
      contents: read

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # full history: the subject gate and git-cliff read commits back to the previous tag
          fetch-depth: 0
          persist-credentials: false

      # A new branch is checked from where it left origin/dev, which the full-history checkout
      # fetches. A forced push and a dispatched run have no meaningful range and pass.
      - name: check-commit-subjects
        uses: osslabz/github-actions/commit-subject-check@v1
        with:
          default-branch: dev

      - name: prepare-build
        uses: ./.github/actions/prepare-build
        with:
          server-id: central
          server-username-env-var: MAVEN_USERNAME
          server-password-env-var: MAVEN_PASSWORD
          server-origin: https://central.sonatype.com

      # After prepare-build, because setup-java keys its Maven cache on the poms' contents:
      # rewriting them first would miss that cache on every branch but dev. Shared with the
      # osslabz repos, which is why the integration branch is an input rather than assumed.
      - name: set-snapshot-version
        uses: osslabz/github-actions/snapshot-version@v1
        with:
          default-branch: dev

      # peekaboot-publish carries central-publishing-maven-plugin, which routes a -SNAPSHOT to
      # Central's snapshot repository by itself. The signature stays behind in
      # peekaboot-release: Central validates a release and takes a snapshot as it comes.
      # A run without the publishing secret, which covers every run GitHub hands Dependabot's
      # secrets, verifies what the others publish; a deploy without it would fail on Central's
      # 401. Keyed on the secret rather than the actor, because the actor of the dispatch that
      # follows a Dependabot merge is unconfirmed: if it counts as Dependabot's, dev's snapshot
      # waits for the next push to dev.
      - name: maven-build-publish
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          MAVEN_GOAL: ${{ secrets.OSSRH_TOKEN != '' && 'deploy' || 'verify' }}
        run: ./mvnw --batch-mode clean "$MAVEN_GOAL" -P peekaboot-publish

      - name: install-git-cliff
        uses: ./.github/actions/install-git-cliff

      - name: release-notes-tests
        run: .github/release-notes/test/run.sh

      - name: await-central-tests
        run: .github/central/test/run.sh

      # On a feature branch there is no draft release, so this summary is the only place
      # the pending notes are visible before the branch is merged.
      - name: unreleased-notes-preview
        run: |
          {
            echo '## Pending release notes'
            .github/release-notes/render.sh --unreleased
          } >> "$GITHUB_STEP_SUMMARY"

  # The workflows and scripts that release and publish run nowhere else before a release, so
  # they are linted on every push.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Checksum-verified downloads rather than third-party actions.
      - name: install-actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/${archive}"
          echo "${SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint

      - name: install-shellcheck
        env:
          VERSION: 0.11.0
          SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          archive="shellcheck-v${VERSION}.linux.x86_64.tar.xz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/v${VERSION}/${archive}"
          echo "${SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" "shellcheck-v${VERSION}/shellcheck"
          mv "$RUNNER_TEMP/shellcheck-v${VERSION}/shellcheck" "$RUNNER_TEMP/shellcheck"

      # Handed this shellcheck rather than the runner's, so it checks the run: blocks with the
      # same version as the scripts below.
      - name: actionlint
        run: '"$RUNNER_TEMP/actionlint" -color -shellcheck "$RUNNER_TEMP/shellcheck"'

      # find rather than a list, so a new script is checked without editing this step.
      - name: shellcheck
        run: find .github -name '*.sh' -exec "$RUNNER_TEMP/shellcheck" {} +

  # The parallel Gradle build, for Dependabot branches only: the Maven job never reads a
  # build.gradle.kts, so without this a Gradle bump would merge unbuilt. Every ecosystem's
  # branch, because a red Maven tool bump is fixed by a Gradle edit pushed onto it.
  # dependabot-pr-auto-merge waits on the whole run, this job included.
  gradle-build:
    if: startsWith(github.ref_name, 'dependabot/')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # These branches change the wrapper, and ./gradlew runs its jar. Fails on a jar whose
      # checksum matches no published Gradle release.
      - name: gradle-wrapper-validation
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # For the JDK and the Playwright browsers the testing-app's UI tests need.
      - name: prepare-build
        uses: ./.github/actions/prepare-build

      - name: gradle-build
        run: ./gradlew --no-daemon build
