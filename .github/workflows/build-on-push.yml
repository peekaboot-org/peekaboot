name: build-on-push

on:
  push:
    branches-ignore:
      - main
  # dependabot-pr-auto-merge dispatches this on dev after a merge, whose GITHUB_TOKEN push
  # starts no run of its own.
  workflow_dispatch:

concurrency:
  group: build-on-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-on-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # full history: the subject gate and git-cliff read commits back to the previous tag
          fetch-depth: 0

      # A new branch is checked from where it left origin/dev, which the full-history checkout
      # fetches. A forced push and a dispatched run have no meaningful range and pass.
      - name: check-commit-subjects
        uses: osslabz/github-actions/commit-subject-check@v1
        with:
          default-branch: dev

      # A local action resolves from the runner's workspace, so the checkout has to come first.
      - name: prepare-build
        uses: ./.github/actions/prepare-build
        with:
          server-id: central
          server-username-env-var: MAVEN_USERNAME
          server-password-env-var: MAVEN_PASSWORD
          server-origin: https://central.sonatype.com

      # After prepare-build, because setup-java keys its Maven cache on the poms' contents:
      # rewriting them first would miss that cache on every branch but dev. Shared with the
      # osslabz repos, which is why the integration branch is an input rather than assumed.
      - name: set-snapshot-version
        uses: osslabz/github-actions/snapshot-version@v1
        with:
          default-branch: dev

      # peekaboot-publish carries central-publishing-maven-plugin, which routes a -SNAPSHOT to
      # Central's snapshot repository by itself. The signature stays behind in
      # peekaboot-release: Central validates a release and takes a snapshot as it comes.
      # Dependabot's runs reach no repository secrets, so they verify what the others publish.
      - name: maven-build-publish
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          MAVEN_GOAL: ${{ github.actor == 'dependabot[bot]' && 'verify' || 'deploy' }}
        run: ./mvnw --batch-mode clean "$MAVEN_GOAL" -P peekaboot-publish

      - name: install-git-cliff
        uses: ./.github/actions/install-git-cliff

      - name: release-notes-tests
        run: .github/release-notes/test/run.sh

      - name: await-central-tests
        run: .github/central/test/run.sh

      # On a feature branch there is no draft release, so this summary is the only place
      # the pending notes are visible before the branch is merged.
      - name: unreleased-notes-preview
        run: |
          {
            echo '## Pending release notes'
            .github/release-notes/render.sh --unreleased
          } >> "$GITHUB_STEP_SUMMARY"

  # The parallel Gradle build, for Gradle-ecosystem Dependabot branches only: the Maven job
  # never reads a build.gradle.kts, so without this a Gradle bump would merge unbuilt.
  # dependabot-pr-auto-merge waits on the whole run, this job included.
  gradle-build:
    if: startsWith(github.ref_name, 'dependabot/gradle/')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # For the JDK and the Playwright browsers the testing-app's UI tests need.
      - name: prepare-build
        uses: ./.github/actions/prepare-build

      - name: gradle-build
        run: ./gradlew --no-daemon build
