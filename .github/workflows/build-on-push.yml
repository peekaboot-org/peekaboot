name: build-on-push

on:
  push:
    branches-ignore:
      - main

concurrency:
  group: build-on-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-on-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # full history: the spotless ratchet resolves a fixed base commit
          fetch-depth: 0

      # A push that creates a branch reports the zero SHA as `before`, and the gate then
      # compares against origin/dev. checkout fetches history but not necessarily that
      # remote-tracking ref, so fetch it rather than depend on checkout's behaviour.
      - name: check-commit-subjects
        run: |
          git fetch --no-tags origin dev:refs/remotes/origin/dev
          .github/release-notes/check-commit-subjects.sh . \
            "${{ github.event.before }}" "${{ github.event.after }}"

      # Ahead of the step that uses it, so a wrong version is a failure here rather than a
      # snapshot published under a coordinate nobody meant.
      - name: snapshot-version-tests
        run: .github/snapshot-publish/test/run.sh

      # A local action resolves from the runner's workspace, so the checkout has to come first.
      - name: prepare-build
        uses: ./.github/actions/prepare-build
        with:
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      # After prepare-build, because setup-java keys its Maven cache on the poms' contents:
      # rewriting them first would miss that cache on every branch but dev.
      - name: set-snapshot-version
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          version="$(.github/snapshot-publish/branch-version.sh pom.xml "$BRANCH")"
          # versions:set rewrites project.build.outputTimestamp unless told not to, which
          # would put this run's clock where the reproducible-build instant belongs.
          ./mvnw --batch-mode versions:set -DnewVersion="$version" \
            -DprocessAllModules=true -DgenerateBackupPoms=false \
            -DupdateBuildOutputTimestampPolicy=never
          echo "publishing $version"

      # peekaboot-publish carries central-publishing-maven-plugin, which routes a -SNAPSHOT to
      # Central's snapshot repository by itself. The signature stays behind in
      # peekaboot-release: Central validates a release and takes a snapshot as it comes.
      # Dependabot's runs reach no repository secrets, so they verify what the others publish.
      - name: maven-build-publish
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          MAVEN_GOAL: ${{ github.actor == 'dependabot[bot]' && 'verify' || 'deploy' }}
        run: ./mvnw --batch-mode clean "$MAVEN_GOAL" -P peekaboot-publish

      - name: install-git-cliff
        uses: ./.github/actions/install-git-cliff

      - name: release-notes-tests
        run: .github/release-notes/test/run.sh

      # On a feature branch there is no draft release, so this summary is the only place
      # the pending notes are visible before the branch is merged.
      - name: unreleased-notes-preview
        run: |
          {
            echo '## Pending release notes'
            .github/release-notes/render.sh --unreleased
          } >> "$GITHUB_STEP_SUMMARY"