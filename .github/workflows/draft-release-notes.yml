name: draft-release-notes

# A separate workflow rather than steps in build-on-push: this needs `contents: write`,
# and build-on-push runs on every branch including dependabot's, whose token is read-only.
on:
  push:
    branches:
      - dev
  # dependabot-pr-auto-merge dispatches this on dev after a merge, whose GITHUB_TOKEN push
  # starts no run of its own.
  workflow_dispatch:

# Keyed on the ref, so a dispatch from another branch cannot cancel dev's render before the
# guard below fails it.
concurrency:
  group: draft-release-notes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  draft-release-notes:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      # The push trigger is limited to dev, but a dispatch names any ref, and this job
      # overwrites the one Unreleased draft.
      - name: guard-dev-ref
        run: |
          if [ "$GITHUB_REF" != "refs/heads/dev" ]; then
            echo "::error::the Unreleased draft is rendered from dev only; this run was dispatched from $GITHUB_REF"
            exit 1
          fi

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # full history: git-cliff resolves the range back to the previous tag
          fetch-depth: 0
          persist-credentials: false

      - name: install-git-cliff
        uses: ./.github/actions/install-git-cliff

      - name: render-unreleased-notes
        run: |
          .github/release-notes/render.sh --unreleased \
            --output unreleased-notes.md

      # `unreleased` is a name, not a tag: GitHub creates the ref only when a draft is
      # published, and cliff.toml's tag_pattern excludes it even then.
      - name: upsert-draft-release
        run: |
          if gh release view unreleased > /dev/null 2>&1; then
            gh release edit unreleased --notes-file unreleased-notes.md
          else
            gh release create unreleased --draft \
              --title Unreleased --notes-file unreleased-notes.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
