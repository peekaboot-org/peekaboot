name: dependabot-pr-auto-merge

# Derived from osslabz/github-actions .github/workflows/dependabot-auto-merge.yml.
# Merges a Dependabot pull request once its build is green. A copy rather than a call, because
# this repository also merges Gradle and npm updates, holds the spring-boot group back, keeps
# every major for a human and drafts the release notes after a merge.
on:
  pull_request:
    branches:
      - dev

jobs:
  # Read-only: fetch-metadata never needs contents or pull-requests write, and isolating it
  # here keeps those out of reach of anything but the job that decides whether to merge.
  metadata:
    # Opened and pushed by Dependabot only: fetch-metadata reports nothing for other pull
    # requests, and a human's push to a Dependabot branch leaves the merge to a human.
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      pull-requests: read

    outputs:
      package-ecosystem: ${{ steps.metadata.outputs.package-ecosystem }}
      update-type: ${{ steps.metadata.outputs.update-type }}
      dependency-group: ${{ steps.metadata.outputs.dependency-group }}

    steps:
      - name: fetch-metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

  merge:
    needs: metadata
    # Opened and pushed by Dependabot only, same as the metadata job: a human's push to a
    # Dependabot branch leaves the merge to a human. Repeated rather than left to the cascading
    # skip of a failed `needs`, so a mis-triggered run reads as an intentional skip, not a
    # failure.
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    # Waits for the build, which is bounded at 30 minutes.
    timeout-minutes: 40
    # Scoped to the pull request: a Dependabot push that supersedes an in-progress merge
    # attempt for it cancels that attempt rather than racing it. Job-level and left off
    # build-merged-dev, so cancelling an attempt here never cancels the dispatch that follows
    # one that already succeeded.
    concurrency:
      group: dependabot-merge-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    permissions:
      contents: write
      pull-requests: write
      # `gh run list` and `gh run watch` read the Actions API.
      actions: read

    outputs:
      merged: ${{ steps.merge.outputs.merged }}

    steps:
      # An allow-list: an update fetch-metadata could not read has no ecosystem or update type
      # and is never merged. Majors of every ecosystem wait for a human, action majors included:
      # release.yml and this workflow run actions build-on-push never exercises, so a breaking
      # one would still go green. The Spring Boot line waits too: this starter implements
      # EndpointExposureOutcomeContributor, constructs Boot's actuator endpoint objects directly
      # (borrowing only the HealthEndpoint bean) and depends on Boot's property-source ordering,
      # so a Boot minor is a compatibility event rather than a bump.
      # Waits for the push build of this head commit rather than `gh pr checks --watch`, which
      # counts this job as a pending check and would wait for itself. Auto-merge is no option
      # either: it arms only when a branch rule holds the pull request open, and dev has none
      # (BUILD.md, Releasing). A red or cancelled build exits non-zero and the pull request
      # stays open; the approval follows the green build.
      # --rebase keeps history linear and Dependabot's conventional subject, which squash would
      # replace with the pull request title. --match-head-commit refuses a head this build did
      # not cover.
      - name: merge-after-green-build
        id: merge
        if: >-
          contains(fromJSON('["github_actions", "maven", "gradle", "npm_and_yarn"]'), needs.metadata.outputs.package-ecosystem)
          && contains(fromJSON('["version-update:semver-patch", "version-update:semver-minor"]'), needs.metadata.outputs.update-type)
          && needs.metadata.outputs.dependency-group != 'spring-boot'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The push run may not exist yet when the pull_request event fires.
          run_id=""
          for _ in $(seq 30); do
            run_id="$(gh run list --workflow build-on-push.yml --commit "$HEAD_SHA" \
              --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            [ -n "$run_id" ] && break
            sleep 10
          done
          if [ -z "$run_id" ]; then
            echo "::error::no build-on-push run for ${HEAD_SHA} after five minutes"
            exit 1
          fi

          gh run watch "$run_id" --exit-status --interval 30
          gh pr review --approve "$PR_URL"
          gh pr merge --rebase --match-head-commit "$HEAD_SHA" "$PR_URL"
          echo "merged=true" >> "$GITHUB_OUTPUT"

  # The merge pushed dev with GITHUB_TOKEN, which starts no push run. The rebased combination
  # on dev was never built as such, so it is built and its release notes drafted here;
  # build-on-push publishes it only if the dispatched run can read the publishing secret. A job
  # of its own, so `actions: write` stays away from the job that runs fetch-metadata.
  build-merged-dev:
    needs: merge
    if: needs.merge.outputs.merged == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      actions: write

    steps:
      - name: dispatch-dev-workflows
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run build-on-push.yml --ref dev
          gh workflow run draft-release-notes.yml --ref dev
