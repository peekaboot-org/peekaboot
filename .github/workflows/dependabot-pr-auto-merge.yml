name: dependabot-pr-auto-merge

on:
  pull_request:
    branches:
      - dev
jobs:
  dependabot-pr-auto-merge:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    if: github.actor == 'dependabot[bot]'
    steps:
      - name: dependabot-pr-fetch-metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # Major updates wait for a human. So do Gradle-ecosystem updates: CI builds with
      # Maven only, so nothing would ever compile a merged Gradle bump (BUILD.md, CI).
      # So does the Spring Boot line: this starter implements EndpointExposureOutcomeContributor,
      # constructs Boot's actuator endpoint objects directly (borrowing only the HealthEndpoint
      # bean) and depends on Boot's property-source ordering, so a Boot minor is a
      # compatibility event rather than a bump.
      # One step for both commands: the condition reads this job's metadata step, which a
      # job-level `if` cannot see.
      - name: dependabot-pr-approve-and-auto-merge
        if: steps.metadata.outputs.update-type != 'version-update:semver-major' && steps.metadata.outputs.package-ecosystem != 'gradle' && steps.metadata.outputs.dependency-group != 'spring-boot'
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
