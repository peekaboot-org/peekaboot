name: dependabot-pr-auto-merge

on:
  pull_request:
    branches:
      - dev
jobs:
  dependabot-pr-auto-merge:
    runs-on: ubuntu-latest
    # The merge step waits for the build, so this job outlives it. Bounded well above the
    # build's own 30, and far below the six-hour default a watch would otherwise inherit.
    timeout-minutes: 40

    permissions:
      contents: write
      pull-requests: write
      # `gh run list` and `gh run watch` read the Actions API. The Checks API is not involved.
      actions: read

    if: github.actor == 'dependabot[bot]'
    steps:
      - name: dependabot-pr-fetch-metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # Major updates wait for a human. So do Gradle-ecosystem updates: CI builds with
      # Maven only, so nothing would ever compile a merged Gradle bump (BUILD.md, CI).
      # So does the Spring Boot line: this starter implements EndpointExposureOutcomeContributor,
      # constructs Boot's actuator endpoint objects directly (borrowing only the HealthEndpoint
      # bean) and depends on Boot's property-source ordering, so a Boot minor is a
      # compatibility event rather than a bump.
      # One step for all three commands: the condition reads this job's metadata step, which a
      # job-level `if` cannot see.
      - name: dependabot-pr-approve-and-merge
        if: steps.metadata.outputs.update-type != 'version-update:semver-major' && steps.metadata.outputs.package-ecosystem != 'gradle' && steps.metadata.outputs.dependency-group != 'spring-boot'
        # Waits for the build rather than using `gh pr merge --auto`. Auto-merge only arms when
        # something holds the pull request open, which was the dev ruleset's required check;
        # that check is gone, because it also refused the release job's pushes and GitHub
        # Actions cannot be granted a ruleset bypass. A red or cancelled build exits non-zero
        # here and the pull request stays open for a human, which is the safe direction.
        # Waits on the push-triggered build-on-push run for this head commit, never on
        # `gh pr checks --watch`: that watches every check on the pull request, this job is one
        # of them, and gh's loop exits only once nothing is pending, with no exclusion for the
        # run executing it. It would wait on itself until the job timeout.
        # The run may not exist yet when the pull_request event fires, hence the poll.
        # --rebase, not --merge: the dev ruleset requires linear history. Dependabot's single
        # commit already carries a conventional subject, which rebase keeps and squash would
        # replace with the pull request title.
        # --match-head-commit: a Dependabot rebase between the watch and the merge would
        # otherwise merge a commit this build never covered.
        run: |
          gh pr review --approve "$PR_URL"

          for _ in $(seq 30); do
            run_id=$(gh run list --workflow build-on-push.yml --commit "$HEAD_SHA" \
              --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$run_id" ] && break
            sleep 10
          done

          if [ -z "$run_id" ]; then
            echo "no build-on-push run for $HEAD_SHA after five minutes" >&2
            exit 1
          fi

          gh run watch "$run_id" --exit-status
          gh pr merge --rebase --match-head-commit "$HEAD_SHA" "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          HEAD_SHA: ${{github.event.pull_request.head.sha}}
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
