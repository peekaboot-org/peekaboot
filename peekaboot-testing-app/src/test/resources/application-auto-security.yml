# The only profile in this module that arms Peekaboot's own guard, used by
# AutoSecuredDashboardIT. A test launch never arms it by detection, so the switch is explicit
# here; the credentials file is redirected per test so nothing is written to a developer's home.
# It stands alone, importing only the Spring Security exclusions, so Peekaboot's guard is the
# only thing that challenges a request.
spring:
  cache:
    # No Redis server under this profile; RedisTraceIT brings a container and switches the cache on.
    type: none
  config:
    import: classpath:servlet-security-exclusions.yml
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false
  docker:
    compose:
      enabled: false

peekaboot:
  enabled: true
  dev-toolbar: false
  security:
    enabled: true

management:
  health:
    redis:
      # The Redis client is on the classpath without a server, which would read as health DOWN.
      enabled: false

app:
  datasource:
    inventory:
      # MODE=MySQL because the inventory runs on MySQL everywhere else; the uuid keeps it per context.
      url: jdbc:h2:mem:inventory-${random.uuid};MODE=MySQL;DB_CLOSE_DELAY=-1
