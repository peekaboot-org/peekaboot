# The only profile in this module that arms Peekaboot's own guard, used by
# AutoSecuredDashboardIT. A test launch never arms it by detection, so the switch is explicit
# here; the credentials file is redirected per test so nothing is written to a developer's home.
# It stands alone, importing the H2 infrastructure and the Spring Security exclusions only, so
# Peekaboot's guard is the only thing that challenges a request.
spring:
  config:
    import:
      - classpath:h2-test-infrastructure.yml
      - classpath:servlet-security-exclusions.yml

peekaboot:
  dev-toolbar:
    enabled: false
  security:
    enabled: true
