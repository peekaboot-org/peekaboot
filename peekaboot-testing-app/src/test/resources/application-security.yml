# The only profile in this module that runs with Spring Security auto-configured, used by
# SecuredPeekabootIT and SecuredDashboardIT. It deliberately does not build
# on application-test.yml: that file excludes the servlet security auto-configuration for
# every other test here (servlet-security-exclusions.yml), which is precisely what these two
# need switched on. Kept to what a secured run actually needs - no masking fixtures, no
# insights tuning - so it imports the H2 infrastructure alone.
spring:
  config:
    import: classpath:h2-test-infrastructure.yml

peekaboot:
  dev-toolbar: true

management:
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        # As in application-test.yml: SecuredDashboardIT reads the toolbar right after
        # page load, well inside the OTel SDK's 5s default batch delay.
        schedule-delay: 50ms
