spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false
  docker:
    compose:
      enabled: false
  task:
    scheduling:
      pool:
        size: 1

peekaboot:
  enabled: true
  dev-toolbar: true

management:
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    org.peekaboot: DEBUG
