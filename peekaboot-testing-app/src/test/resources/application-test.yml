spring:
  config:
    import:
      - classpath:h2-test-infrastructure.yml
      - classpath:servlet-security-exclusions.yml
  datasource:
    # Unused by the in-memory H2 connection itself - bound purely so the Config/Environment
    # tabs have a real, secret-looking property to prove the masking engine against
    # (see UnmaskingControlEnabledIT.togglingTheControlRevealsAMaskedConfigValue and
    # ActuatorMaskingIT).
    password: test-fixture-password
  sql:
    init:
      # OrderStatisticsRepository calls pg_sleep, which H2 lacks; the default mode runs this on embedded databases only.
      schema-locations: classpath:h2-functions.sql
  task:
    scheduling:
      pool:
        size: 1

peekaboot:
  dev-toolbar: true
  # application.yml turns this on for the demo; the masking tests need it off.
  enable-unmasking: false
  # The detected default is off outside a local run; a test launch is neither local nor a
  # deployment, so ErrorPageIT needs it turned on explicitly.
  error-page:
    enabled: true
  insights:
    config-location: classpath:insights-test-panels.yml
    levels:
      - interval: 250ms
        size: 90
      - interval: 1500ms
        size: 100
      - interval: 9s
        size: 50

# Bound to NestedConfigPropertiesFixture purely so ActuatorMaskingIT can prove
# ConfigMapper masks a sensitive key nested inside a @ConfigurationProperties tree - the
# shape a real spring.security.oauth2.client.registration bean has.
nested-fixture:
  registration:
    google:
      client-id: fixture-client-id
      client-secret: fixture-client-secret

management:
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        # Default is 5s (OTel SDK's BatchSpanProcessor); Playwright tests open the trace
        # overlay right after page load, well inside that window, so spans/queries/logs
        # would not have reached the TraceStore yet. Shortened so exports are prompt.
        schedule-delay: 50ms

logging:
  level:
    # INFO keeps IT logs readable; no test asserts on DEBUG output
    org.peekaboot: INFO

app:
  # Blank: no profile service under this profile, so person pages make no outbound call.
  profile-service:
    url: ""
