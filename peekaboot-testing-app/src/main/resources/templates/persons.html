<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Persons</title>
    <style th:replace="~{fragments/styles :: pageStyles}"></style>
</head>
<body>
    <h1>Persons</h1>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Email</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="person : ${persons}" th:attr="data-person-id=${person.id}">
                <td th:text="${person.id}"></td>
                <td th:text="${person.firstName}"></td>
                <td th:text="${person.lastName}"></td>
                <td th:text="${person.email}"></td>
                <td>
                    <a class="button" th:href="@{/persons/{id}(id=${person.id})}">View</a>
                    <a class="button" th:href="@{/persons/{id}/edit(id=${person.id})}">Edit</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
