<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="|Edit ${person.firstName} ${person.lastName}|">Edit person</title>
    <style th:replace="~{fragments/styles :: pageStyles}"></style>
</head>
<body>
    <h1 th:text="|Edit ${person.firstName} ${person.lastName}|">Edit person</h1>
    <form th:action="@{/persons/{id}(id=${person.id})}" th:method="put">
        <label for="firstName">First Name</label>
        <input id="firstName" name="firstName" th:value="${person.firstName}" required>
        <label for="lastName">Last Name</label>
        <input id="lastName" name="lastName" th:value="${person.lastName}" required>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" th:value="${person.email}">
        <p>
            <button type="submit">Save</button>
            <a class="button" th:href="@{/persons/{id}(id=${person.id})}">Cancel</a>
        </p>
    </form>
</body>
</html>
