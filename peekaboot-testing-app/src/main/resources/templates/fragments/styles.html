<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Shared sample-page styles</title>
    <!-- Inline rather than a static stylesheet: a second request would trace as a page load of its own. -->
    <style th:fragment="pageStyles">
        body { font-family: system-ui, sans-serif; margin: 2rem; }
        table { border-collapse: collapse; width: 100%; max-width: 800px; }
        th, td { border: 1px solid #ddd; padding: 8px 12px; text-align: left; }
        th { background: #f5f5f5; }
        tr:hover { background: #f9f9f9; }
        a.button, button { display: inline-block; padding: 4px 12px; border: 1px solid #6b7280; border-radius: 4px; background: #fff; color: #111827; font: inherit; text-decoration: none; cursor: pointer; }
        dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; }
        dd { margin: 0; }
        label { display: block; margin-top: 12px; }
        input { padding: 6px 8px; min-width: 20rem; font: inherit; }
        #demo-nav { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid #ddd; font-size: 0.875rem; }
        .demo-nav__group { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
        .demo-nav__title { font-weight: 600; color: #374151; }
        #demo-nav form { display: inline; margin: 0; }
    </style>
</head>
<body>
</body>
</html>
