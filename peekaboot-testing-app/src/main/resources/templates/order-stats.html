<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order statistics</title>
    <style th:replace="~{fragments/styles :: pageStyles}"></style>
</head>
<body>
    <h1>Order statistics</h1>
    <p>Counted by one query that waits 80 ms in <code>pg_sleep</code>, so Peekaboot flags it as a slow query.</p>
    <table>
        <thead>
            <tr><th>Status</th><th>Orders</th></tr>
        </thead>
        <tbody>
            <tr th:each="count : ${statusCounts}" th:attr="data-status=${count.status}">
                <td th:text="${count.status}"></td>
                <td th:text="${count.orderCount}"></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
