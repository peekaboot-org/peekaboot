server:
  port: 8083

spring:
  application:
    name: peekaboot-example-app
  datasource:
  # is configured automatically by spring-boot's compose support

  jpa:
    open-in-view: false
    properties:
      "[hibernate.generate_statistics]": true

management:
  endpoints:
    web:
#      exposure:
#        include: '*'

  endpoint:
    health:
      show-details: always

  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
    process:
      enabled: true

  observations:
    http:
      server:
        requests:
          write-trace-header: true