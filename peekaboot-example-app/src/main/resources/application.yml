server:
  port: 8083

spring:
  application:
    name: peekaboot-example-app
  datasource:
  # is configured automatically by spring-boot's compose support

  jpa:
    open-in-view: false

peekaboot:
  dev-toolbar: true

# observability settings (health details, info contributors, trace sampling,
# observation annotations, OTLP export off) come from peekaboot's defaults
management:
  endpoints:
    web:
      exposure:
        include: "*"
